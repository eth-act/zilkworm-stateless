name: Release

# Triggered by a version tag push (e.g. v0.1.0, v1.2.3-rc1).
# Builds the SP1, ZisK, and OpenVM guest ELFs with a pinned, unmodified
# toolchain, derives each program verifying key directly from the zkVM's own
# SDK, signs every artifact with minisign (public key shipped in the release),
# and publishes a GitHub Release.
#
# Artifact naming follows the EF zkEVM guest-program standard:
#   stateless-validator-zilkworm-<zkVMName>-<zkVMVersion>.elf / .vk
# zkVM versions come from the checked-in ZKVM_VERSIONS file.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"   # v0.1.0, v1.2.3-rc1, etc.

permissions:
  contents: write   # needed to create a GitHub Release

env:
  # Unmodified upstream GCC via xPack — pinned exactly (never @latest):
  # provenance and reproducibility both depend on this. Matches PROVENANCE.md.
  RISCV_XPACK_VERSION: "15.2.0-1.1"

jobs:
  build:
    name: Build ${{ matrix.zkvm }} guest + vk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zkvm: [sp1, zisk, openvm]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read zkVM version
        id: ver
        run: |
          VERSION=$(grep "^${{ matrix.zkvm }}=" ZKVM_VERSIONS | cut -d= -f2)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=stateless-validator-zilkworm-${{ matrix.zkvm }}-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install CMake 3.28+
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Install xPack riscv-none-elf-gcc (pinned)
        run: |
          npm install --location=global xpm@latest
          xpm install "@xpack-dev-tools/riscv-none-elf-gcc@${RISCV_XPACK_VERSION}" --global
          "$HOME/.local/xPacks/@xpack-dev-tools/riscv-none-elf-gcc/${RISCV_XPACK_VERSION}/.content/bin/riscv-none-elf-gcc" --version

      - name: Build guest ELF
        run: make guest_${{ matrix.zkvm }}

      - name: Install Rust (for keygen)
        uses: dtolnay/rust-toolchain@stable

      # ZisK only: the ROM-merkle verkey requires the ZisK proving key and a
      # one-time rom-setup for this ELF (large download — free disk first).
      - name: Free up disk space (zisk)
        if: matrix.zkvm == 'zisk'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install ZisK proving key + rom-setup (zisk)
        if: matrix.zkvm == 'zisk'
        run: |
          # ZISK_VERSION must NOT carry a leading 'v' — ziskup adds it itself.
          curl -sSfL https://raw.githubusercontent.com/0xPolygonHermez/zisk/main/ziskup/install.sh \
            | ZISK_VERSION="${{ steps.ver.outputs.version }}" bash
          export PATH="$HOME/.zisk/bin:$PATH"
          cargo-zisk rom-setup -e build/zisk/z6m_guest.elf

      - name: Generate program verifying key
        # Derived from the zkVM's own SDK (see keygen/src/main.rs) — no
        # intermediary tooling. Version pins in keygen/Cargo.toml must match
        # ZKVM_VERSIONS.
        run: |
          cargo run --release \
            --manifest-path keygen/Cargo.toml \
            --features ${{ matrix.zkvm }} -- \
            --elf build/${{ matrix.zkvm }}/z6m_guest.elf \
            --out build/${{ matrix.zkvm }}/z6m_guest.vk

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp build/${{ matrix.zkvm }}/z6m_guest.elf "dist/${{ steps.ver.outputs.artifact }}.elf"
          cp build/${{ matrix.zkvm }}/z6m_guest.vk  "dist/${{ steps.ver.outputs.artifact }}.vk"

      - name: Upload staged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ver.outputs.artifact }}
          path: dist/
          retention-days: 1   # only needed until the release job picks them up

  ef-tests:
    name: EF blockchain tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with ethereum-tests submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install CMake 3.28+
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build

      - name: Build and run EF tests
        run: make test

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, ef-tests]  # all must succeed
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets/
          merge-multiple: true

      - name: Compute SHA-256 checksums
        working-directory: release-assets
        run: |
          sha256sum *.elf *.vk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Sign every artifact with minisign. The trusted comment (-t) binds the
      # signature to the artifact's filename, and the public key is published
      # as a release asset so consumers can verify without any out-of-band
      # channel (pin it after first use). Requires three repository secrets:
      #   MINISIGN_SECRET_KEY — the minisign secret key file contents
      #   MINISIGN_PUBLIC_KEY — the minisign public key file contents
      #   MINISIGN_PASSWORD   — the secret key password ("" if unencrypted)
      - name: Sign artifacts with minisign
        working-directory: release-assets
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          printf '%s\n' "$MINISIGN_PUBLIC_KEY" > minisign.pub

          for f in *.elf *.vk SHA256SUMS.txt; do
            echo "Signing $f..."
            echo "$MINISIGN_PASSWORD" | minisign -Sm "$f" -s minisign.key -x "$f.minisig" -t "$f"
          done

          rm -f minisign.key
          ls -la

      - name: Generate release notes
        run: |
          {
            echo "## zilkworm stateless-validator guests — ${{ github.ref_name }}"
            echo ""
            echo "Spec-compliant stateless EVM validator guest programs (C++,"
            echo "silkworm-based) for the SP1, ZisK, and OpenVM zkVMs."
            echo ""
            echo "Every artifact is minisign-signed (\`<file>.minisig\`, trusted"
            echo "comment = filename); the signing public key is attached as"
            echo "\`minisign.pub\`. Verifying keys are derived directly from each"
            echo "zkVM's SDK at the version encoded in the artifact name."
            echo ""
            echo "| Artifact | Verifying key |"
            echo "|---|---|"
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
            for elf in release-assets/*.elf; do
              name=$(basename "$elf")
              vk="${name%.elf}.vk"
              echo "| [\`$name\`]($RELEASE_URL/$name) | [\`$vk\`]($RELEASE_URL/$vk) |"
            done
            echo ""
            echo "### Build provenance"
            echo ""
            echo "- Toolchain: unmodified xPack riscv-none-elf-gcc \`${RISCV_XPACK_VERSION}\` (see PROVENANCE.md)"
            echo "- EF blockchain tests passed before this release was published"
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "zilkworm stateless guests ${{ github.ref_name }}"
          body_path: release-body.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # rc/alpha/beta tags → pre-release
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
