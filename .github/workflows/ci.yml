name: CI

# Run on every push and pull request.
# Validates that both guest programs build and that the EF blockchain tests pass.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sp1:
    name: Build SP1 guest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install CMake 3.28+
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Install xPack riscv-none-elf-gcc
        run: |
          npm install --location=global xpm@latest
          xpm install @xpack-dev-tools/riscv-none-elf-gcc@latest --global

      - name: Build SP1 guest
        run: make guest_sp1

      - name: Upload SP1 ELF artifact
        uses: actions/upload-artifact@v7
        with:
          name: z6m_guest_sp1
          path: |
            build/sp1/z6m_guest.elf
            build/sp1/z6m_guest.bin
            build/sp1/z6m_guest.text
          retention-days: 7
  build-zisk:
    name: Build ZisK guest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install CMake 3.28+
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Install xPack riscv-none-elf-gcc
        run: |
          npm install --location=global xpm@latest
          xpm install @xpack-dev-tools/riscv-none-elf-gcc@latest --global

      - name: Build ZisK guest
        run: make guest_zisk

      - name: Upload ZisK ELF artifact
        uses: actions/upload-artifact@v7
        with:
          name: z6m_guest_zisk
          path: |
            build/zisk/z6m_guest.elf
            build/zisk/z6m_guest.bin
            build/zisk/z6m_guest.text
          retention-days: 7
  build-openvm:
    name: Build OpenVM guest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install CMake 3.28+
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Install xPack riscv-none-elf-gcc
        run: |
          npm install --location=global xpm@latest
          xpm install @xpack-dev-tools/riscv-none-elf-gcc@latest --global

      - name: Build OpenVM guest
        run: make guest_openvm

      - name: Upload OpenVM ELF artifact
        uses: actions/upload-artifact@v7
        with:
          name: z6m_guest_openvm
          path: |
            build/openvm/z6m_guest.elf
            build/openvm/z6m_guest.bin
            build/openvm/z6m_guest.text
          retention-days: 7
  ef-tests:
    name: EF blockchain tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with ethereum-tests submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install CMake 3.28+
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build

      - name: Build and run EF tests
        run: make test

      - name: Report result
        if: always()
        run: echo "EF test job completed with exit code $?"
