[package]
name    = "z6m-keygen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "keygen"
path = "src/main.rs"

# Exactly one zkVM feature must be enabled per build (enforced in main.rs).
# Versions must stay in sync with ../ZKVM_VERSIONS.
[features]
sp1    = ["dep:sp1-sdk", "dep:tokio", "dep:bincode"]
zisk   = ["dep:zisk-sdk", "dep:bincode"]
openvm = ["dep:openvm-sdk", "dep:openvm-sdk-config", "dep:openvm-stark-sdk"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"

# SP1 — upstream tag v6.3.1 (what ecosystem verifiers pin).
sp1-sdk = { git = "https://github.com/succinctlabs/sp1", tag = "v6.3.1", optional = true }
tokio   = { version = "1", features = ["rt-multi-thread"], optional = true }

# ZisK — tag v1.0.0-alpha.
zisk-sdk = { git = "https://github.com/0xPolygonHermez/zisk", tag = "v1.0.0-alpha", optional = true }

# OpenVM — han0110 fork tracking upstream tag v2.0.0-rc.3 (the ecosystem pin).
openvm-sdk        = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.0.0-rc.3", optional = true }
openvm-sdk-config = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.0.0-rc.3", default-features = false, optional = true }
openvm-stark-sdk  = { git = "https://github.com/han0110/stark-backend.git", branch = "patch/develop-v2-04611d9", default-features = false, features = ["parallel"], optional = true }

bincode = { version = "1", optional = true }
