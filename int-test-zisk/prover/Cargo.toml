[package]
name    = "z6m_zisk_prover"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "z6m_zisk_prover"
path = "src/main.rs"

[dependencies]
# ZisK SDK — ProverClient, GuestProgram, ZiskStdin, PublicValues, ProofKind, etc.
zisk-sdk  = { git = "https://github.com/0xPolygonHermez/zisk", tag = "v0.18.0" }

# Low-level emulator — used for `execute` mode so we can read public outputs
# without requiring a proving key on disk.
ziskemu   = { git = "https://github.com/0xPolygonHermez/zisk", tag = "v0.18.0" }
zisk-core   = { git = "https://github.com/0xPolygonHermez/zisk", tag = "v0.18.0" }
zisk-common = { git = "https://github.com/0xPolygonHermez/zisk", tag = "v0.18.0" }

clap      = { version = "4", features = ["derive"] }
eyre      = "0.6"
tracing   = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio     = { version = "1", features = ["full"] }
hex       = "0.4"
tempfile  = "3"

[build-dependencies]
# No special build-dependencies needed — we just canonicalize the ELF path.
