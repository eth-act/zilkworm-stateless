[package]
name = "z6ms_stateless_validator"
version = "0.1.0"
edition = "2021"
description = "Host-side adapter that converts a StatelessInput into the SSZ SszStatelessInput format consumed by the zilkworm-stateless zkVM guests."
license = "Apache-2.0"

[dependencies]
alloy-consensus = { version = "2.0", default-features = false }
alloy-primitives = { version = "1.0", default-features = false }
alloy-rlp = "0.3"
alloy-trie = "0.9"
anyhow = "1"
sha2 = "0.10"
stateless = { git = "https://github.com/paradigmxyz/stateless", rev = "e5480e71a8031641ff471cad9dc482a7a14b32d5", default-features = false }
